version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /adapters/l2/redis
      - /adapters/backplane/redis
      - /scripts/verify
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
