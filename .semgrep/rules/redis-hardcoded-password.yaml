rules:
  - id: redis-hardcoded-password
    languages: [go]
    severity: ERROR
    message: >-
      A Redis password is hardcoded. Read it from configuration or a secret
      store (e.g. os.Getenv or an injected options struct) and pass it in.
    patterns:
      - pattern-either:
          - pattern: |
              redis.Options{..., Password: "$PW", ...}
          - pattern: |
              redis.ClusterOptions{..., Password: "$PW", ...}
          - pattern: |
              redis.UniversalOptions{..., Password: "$PW", ...}
      - metavariable-regex:
          metavariable: $PW
          regex: .+
