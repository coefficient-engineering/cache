version: "2"
linters:
  default: standard
  enable:
    # existing
    - contextcheck
    - godoclint
    - misspell
    - revive
    - godot
    - godox
    - modernize
    # correctness
    - noctx
    - containedctx
    - fatcontext
    - errorlint
    - errname
    - nilerr
    - nilnesserr
    - nilnil
    - errchkjson
    - durationcheck
    - copyloopvar
    - intrange
    - makezero
    - reassign
    - recvcheck
    - exhaustive
    - forcetypeassert
    - asasalint
    - gocheckcompilerdirectives
    - musttag
    - sloglint
    # complexity
    - cyclop
    - gocognit
    - funlen
    - nestif
    - maintidx
    # escape hatches
    - nolintlint
    - forbidigo
    # magic values
    - mnd
    - goconst
    # architecture
    - depguard
    # readability
    - dupl
    - dupword
    - whitespace
    - perfsprint
    - prealloc
    - wastedassign
    - unconvert
    - unparam
    - usestdlibvars
    - mirror
    - exptostd
    - predeclared
    - goprintffuncname
    - nakedret
    - dogsled
    - iface
    - interfacebloat
    # security
    - gosec
    - bidichk
    - asciicheck
    # tests
    - thelper
    - tparallel
    - usetesting
    - testableexamples
  settings:
    cyclop:
      max-complexity: 12
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 40
      ignore-comments: true
    nestif:
      min-complexity: 4
    maintidx:
      under: 20
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    nolintlint:
      require-explanation: true
      require-specific: true
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: library code must not write to stdout; use the configured *slog.Logger
    mnd:
      ignored-numbers: ["2", "10", "64", "100"]
    goconst:
      min-len: 3
      min-occurrences: 3
      numbers: false
    dupl:
      threshold: 150
    gosec:
      severity: medium
      confidence: medium
    sloglint:
      static-msg: true
      kv-only: false
      attr-only: false
    depguard:
      rules:
        core:
          list-mode: lax
          files:
            - $all
            - "!**/adapters/l2/redis/**"
            - "!**/adapters/backplane/redis/**"
            - "!**/scripts/verify/**"
            - "!$test"
          deny:
            - pkg: github.com/redis
              desc: the core module is zero-dependency; Redis belongs in adapters/*/redis modules
            - pkg: github.com/google/uuid
              desc: the core module is zero-dependency; use crypto/rand
            - pkg: github.com/alicebob/miniredis
              desc: test-only Redis fake; adapters/*/redis tests only
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: file-length-limit
          arguments: [{max: 500, skipComments: true, skipBlankLines: true}]
        - name: max-control-nesting
          arguments: [4]
        - name: argument-limit
          arguments: [5]
        - name: package-directory-mismatch
        - name: var-naming
        - name: error-naming
        - name: error-strings
        - name: receiver-naming
        - name: confusing-naming
        - name: import-alias-naming
        - name: package-comments
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unnecessary-stmt
        - name: flag-parameter
        - name: deep-exit
        - name: unhandled-error
          arguments: ["fmt.Fprintf", "fmt.Fprintln", "strings.Builder.WriteString"]
        - name: unchecked-type-assertion
        - name: use-any
        - name: use-errors-new
        - name: identical-branches
        - name: unused-parameter
        - name: unused-receiver
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: range-val-in-closure
        - name: modifies-parameter
        - name: unexported-return
        - name: filename-format
          arguments: ["^[_a-z][_a-z0-9]*\\.go$"]
    godoclint:
      default: all
    godot:
      period: true
      capital: false
      check-all: false
      exclude: ["^todo", "^fixme"]
  exclusions:
    generated: lax
    presets: [comments, common-false-positives, legacy, std-error-handling]
    rules:
      - path: _test\.go$
        linters: [errcheck, godoclint, funlen, mnd, goconst, dupl, gosec, forcetypeassert, maintidx, cyclop, gocognit]
formatters:
  enable: [gofumpt, goimports, gci]
  settings:
    goimports:
      local-prefixes: [github.com/coefficient-engineering/cache]
    gci:
      sections: [standard, default, prefix(github.com/coefficient-engineering/cache)]
  exclusions:
    generated: lax
